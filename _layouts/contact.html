<section class="section contact-section"><div class="wrap contact-grid"><div><p class="eyebrow">Let’s make room for care</p><h1>Start with<br>a conversation.</h1><p class="lede">Tell us about your practice, your team, and what gets in the way of care. We’ll start by listening.</p><a class="text-link" href="mailto:{{ site.email }}">{{ site.email }} <span aria-hidden="true">↗</span></a></div><form class="contact-form" action="{{ page.form_action }}" method="POST"><h2>Let’s talk about your practice.</h2><label for="name">Name</label><input id="name" name="name" autocomplete="name" required><label for="email">Work email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="message">What would you like to make easier?</label><textarea id="message" name="message" rows="5" required aria-describedby="message-help"></textarea><p id="message-help" class="form-note">Please share practice details only, without patient information.</p><button class="button" type="submit">Send message <span aria-hidden="true">↗</span></button></form></div></section>
